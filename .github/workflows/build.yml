          @Composable
          fun NESRApp() {

              var selectedReading by remember {
                  mutableStateOf<Reading?>(null)
              }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF0D0A12),
                      surface = Color(0xFF18131F),
                      primary = Color(0xFFD8B56A),
                      secondary = Color(0xFF9D7BBA),
                      onBackground = Color(0xFFF7F1E7),
                      onSurface = Color(0xFFF7F1E7)
                  )
              ) {

                  if (selectedReading == null) {

                      HomeScreen(
                          onReadingSelected = {
                              selectedReading = it
                          }
                      )

                  } else {

                      QuestionScreen(
                          reading = selectedReading!!,
                          onBack = {
                              selectedReading = null
                          }
                      )
                  }
              }
          }

          @Composable
          fun HomeScreen(
