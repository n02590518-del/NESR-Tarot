name: Build NESR Tarot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: إنشاء مشروع Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nesrtarot/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NESR-Tarot"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nesrtarot.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nesrtarot.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="background">#0D0A12</color>
              <color name="card">#1B1524</color>
              <color name="gold">#D8B56A</color>
              <color name="text">#F7F1E7</color>
              <color name="muted">#B9AFC5</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/background</item>
                  <item name="android:navigationBarColor">@color/background</item>
                  <item name="android:windowBackground">@color/background</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="NESR Tarot"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp"
                  android:gravity="center_horizontal">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="NESR"
                      android:textColor="@color/gold"
                      android:textSize="40sp"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:layout_marginTop="30dp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="TAROT • ENERGY"
                      android:textColor="@color/muted"
                      android:textSize="13sp"
                      android:gravity="center"
                      android:layout_marginBottom="35dp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="اختار قراءتك"
                      android:textColor="@color/text"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:gravity="right"
                      android:layout_marginBottom="8dp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="اسأل سؤالك واختار نوع القراءة المناسب ليك"
                      android:textColor="@color/muted"
                      android:textSize="14sp"
                      android:gravity="right"
                      android:layout_marginBottom="25dp"/>

                  <Button
                      android:id="@+id/yesNo"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="❓  نعم أو لا"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/feelings"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="❤️  مشاعر وتفكير"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/intentions"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="🔥  نوايا وخطوات"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/message"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="💌  رسالة من الحبيب"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/returnReading"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="🔄  الرجوع ومتى"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/currentEnergy"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="✨  الطاقة الحالية"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/future"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="🔮  القادم"
                      android:textSize="18sp"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/fullReading"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="👑  قراءة كاملة"
                      android:textSize="18sp"
                      android:layout_marginBottom="25dp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="🔴 NESR LIVE"
                      android:textColor="@color/gold"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:layout_marginBottom="10dp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="تابع اللايف والقراءات الجديدة"
                      android:textColor="@color/muted"
                      android:textSize="14sp"
                      android:gravity="center"
                      android:layout_marginBottom="30dp"/>

              </LinearLayout>

          </ScrollView>
          EOF

          cat > app/src/main/java/com/nesrtarot/app/MainActivity.java <<'EOF'
          package com.nesrtarot.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  setButton(R.id.yesNo, "نعم أو لا");
                  setButton(R.id.feelings, "مشاعر وتفكير");
                  setButton(R.id.intentions, "نوايا وخطوات");
                  setButton(R.id.message, "رسالة من الحبيب");
                  setButton(R.id.returnReading, "الرجوع ومتى");
                  setButton(R.id.currentEnergy, "الطاقة الحالية");
                  setButton(R.id.future, "القادم");
                  setButton(R.id.fullReading, "قراءة كاملة");
              }

              private void setButton(int id, final String name) {
                  Button button = findViewById(id);

                  button.setOnClickListener(v ->
                      Toast.makeText(
                          MainActivity.this,
                          "أنت اخترت: " + name,
                          Toast.LENGTH_SHORT
                      ).show()
                  );
              }
          }
          EOF

      - name: بناء ملف APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: NESR-Tarot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
